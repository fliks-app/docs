@if (headings().length) {
  <nav class="sticky top-24 max-h-[calc(100dvh-7rem)] overflow-y-auto text-sm" aria-label="On this page">
    <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-base-content/60">On this page</p>
    <ul class="flex flex-col border-s border-base-300">
      @for (h of headings(); track h.id) {
        <li>
          <a
            [routerLink]="pageUrl()"
            [fragment]="h.id"
            class="-ms-px block border-s-2 py-1 leading-snug transition-colors"
            [class]="
              (h.level === 3 ? 'ps-6 ' : 'ps-3 ') +
              (activeId() === h.id
                ? 'border-primary text-primary'
                : 'border-transparent text-base-content/70 hover:text-base-content')
            "
            [attr.aria-current]="activeId() === h.id ? 'location' : null"
          >
            {{ h.text }}
          </a>
        </li>
      }
    </ul>
  </nav>
}
