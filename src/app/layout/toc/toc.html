@if (headings().length) {
  <nav class="sticky top-20 text-sm" aria-label="On this page">
    <div class="mb-2 px-2 text-xs font-semibold uppercase tracking-wide opacity-50">On this page</div>
    <ul class="flex flex-col gap-0.5 border-s border-base-300">
      @for (h of headings(); track h.id) {
        <li>
          <a
            [href]="'#' + h.id"
            class="-ms-px block truncate border-s-2 py-0.5 ps-3 opacity-70 hover:opacity-100"
            [class.ps-6]="h.level === 3"
            [class.border-primary]="activeId() === h.id"
            [class.text-primary]="activeId() === h.id"
            [class.opacity-100]="activeId() === h.id"
            [class.border-transparent]="activeId() !== h.id"
          >
            {{ h.text }}
          </a>
        </li>
      }
    </ul>
  </nav>
}
