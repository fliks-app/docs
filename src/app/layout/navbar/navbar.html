<header class="navbar sticky top-0 z-30 min-h-16 gap-2 border-b border-base-300 bg-base-100/85 px-3 backdrop-blur sm:px-4">
  <div class="flex flex-1 items-center gap-1">
    <button type="button" class="btn btn-ghost btn-square lg:hidden" aria-label="Open navigation" (click)="openDrawer()">
      <svg lucideMenu class="h-5 w-5" aria-hidden="true"></svg>
    </button>

    <a routerLink="/" class="btn btn-ghost gap-2 px-2 text-base font-semibold normal-case">
      <img [src]="logo()" alt="Fliks" class="h-6 w-auto" />
      <span class="hidden sm:inline">docs</span>
    </a>

    <nav class="ms-2 hidden items-center gap-1 md:flex" aria-label="Main">
      @if (userGuideUrl) {
        <a [routerLink]="userGuideUrl" class="btn btn-ghost btn-sm">User guide</a>
      }
      @if (developersUrl) {
        <a [routerLink]="developersUrl" class="btn btn-ghost btn-sm">Developers</a>
      }
    </nav>
  </div>

  <div class="flex items-center gap-1">
    <button
      type="button"
      class="btn btn-ghost btn-sm gap-2 font-normal text-base-content/70 max-sm:btn-square sm:w-52 sm:justify-start sm:border-base-300 sm:bg-base-200/60"
      aria-label="Search the docs"
      aria-keyshortcuts="Control+K Meta+K"
      (click)="searchOverlay.open()"
    >
      <svg lucideSearch class="h-4 w-4" aria-hidden="true"></svg>
      <span class="hidden sm:inline">Search</span>
      <kbd class="kbd kbd-xs ms-auto hidden sm:inline-flex">Ctrl K</kbd>
    </button>

    <button
      type="button"
      class="btn btn-ghost btn-square"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (theme.isDark()) {
        <svg lucideSun class="h-5 w-5" aria-hidden="true"></svg>
      } @else {
        <svg lucideMoon class="h-5 w-5" aria-hidden="true"></svg>
      }
    </button>

    <a
      href="https://fliks.media/"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-ghost btn-sm hidden lg:inline-flex"
    >
      Website
    </a>

    <a
      href="https://github.com/fliks-app"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-ghost btn-square"
      aria-label="Fliks on GitHub"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.79-.25.79-.55 0-.27-.01-1.16-.02-2.1-3.2.69-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.26-1.28-5.26-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.7 5.4-5.28 5.68.42.36.78 1.07.78 2.16 0 1.56-.01 2.81-.01 3.19 0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
        />
      </svg>
    </a>
  </div>
</header>
