@if (meta(); as m) {
  <div class="mx-auto flex w-full max-w-[76rem] justify-center gap-12 px-4 py-8 sm:px-8 lg:py-10">
    <article class="min-w-0 max-w-3xl flex-1">
      <header class="mb-8">
        <p class="mb-2 text-sm font-semibold text-primary">{{ m.sectionTitle }}</p>
        <h1 class="text-3xl font-bold tracking-tight text-balance sm:text-4xl">{{ m.title }}</h1>
        @if (m.description) {
          <p class="mt-3 text-lg text-base-content/70">{{ m.description }}</p>
        }
      </header>

      <div #container class="doc-prose prose" [innerHTML]="safeHtml()"></div>

      <nav class="mt-14 grid gap-3 sm:grid-cols-2" aria-label="Previous and next pages">
        @if (m.prev) {
          <a [routerLink]="m.prev.url" class="doc-pager-link">
            <span class="text-xs text-base-content/60">Previous</span>
            <span class="font-medium text-primary">&larr; {{ m.prev.title }}</span>
          </a>
        } @else {
          <span class="hidden sm:block"></span>
        }
        @if (m.next) {
          <a [routerLink]="m.next.url" class="doc-pager-link sm:items-end sm:text-end">
            <span class="text-xs text-base-content/60">Next</span>
            <span class="font-medium text-primary">{{ m.next.title }} &rarr;</span>
          </a>
        }
      </nav>

      <p class="mt-8 border-t border-base-300 pt-6 text-sm">
        <a [href]="m.editUrl" target="_blank" rel="noopener noreferrer" class="link link-hover text-base-content/60">
          Edit this page on GitHub
        </a>
      </p>
    </article>

    <aside class="hidden w-56 shrink-0 xl:block">
      <app-toc [headings]="m.headings" [pageUrl]="m.url" />
    </aside>
  </div>
}
