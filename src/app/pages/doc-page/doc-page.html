@if (meta(); as m) {
  <div class="mx-auto flex w-full max-w-[80rem] gap-10 px-4 py-8 sm:px-6 lg:px-8">
    <article class="min-w-0 flex-1">
      <p class="mb-2 text-sm font-medium uppercase tracking-wide opacity-50">{{ m.sectionTitle }}</p>
      <h1 class="mb-6 text-3xl font-bold sm:text-4xl">{{ m.title }}</h1>

      <div #container class="doc-prose prose max-w-none dark:prose-invert" [innerHTML]="safeHtml()"></div>

      <div class="mt-12 flex flex-col gap-3 border-t border-base-300 pt-6 sm:flex-row sm:justify-between">
        @if (m.prev) {
          <a [routerLink]="m.prev.url" class="btn btn-outline btn-sm justify-start">
            <span aria-hidden="true">&larr;</span>&nbsp;{{ m.prev.title }}
          </a>
        } @else {
          <span></span>
        }
        @if (m.next) {
          <a [routerLink]="m.next.url" class="btn btn-outline btn-sm justify-end sm:ms-auto">
            {{ m.next.title }}&nbsp;<span aria-hidden="true">&rarr;</span>
          </a>
        }
      </div>

      <div class="mt-6">
        <a [href]="m.editUrl" target="_blank" rel="noopener noreferrer" class="link link-hover text-sm opacity-60">
          Edit this page on GitHub
        </a>
      </div>
    </article>

    <aside class="hidden w-56 shrink-0 xl:block">
      <app-toc [headings]="m.headings" />
    </aside>
  </div>
}
