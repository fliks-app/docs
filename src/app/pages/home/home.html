<div class="mx-auto max-w-5xl px-4 py-16 sm:py-24">
  <div class="mb-16 text-center">
    <img [src]="logo()" alt="Fliks" class="mx-auto mb-6 h-10 w-auto sm:h-12" />
    <p class="text-lg opacity-70 sm:text-xl">Everything you need to install, run and extend Fliks.</p>
  </div>

  @if (sections.length) {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (section of sections; track section.slug) {
        <a
          [routerLink]="section.pages[0].url"
          class="card border border-base-300 bg-base-200/50 p-5 transition-colors hover:bg-base-200"
        >
          <h2 class="mb-1 font-semibold">{{ section.title }}</h2>
          <p class="line-clamp-2 text-sm opacity-70">
            {{ section.pages[0].description || (section.pages.length + ' pages') }}
          </p>
        </a>
      }
    </div>
  } @else {
    <p class="text-center opacity-60">Documentation is on its way.</p>
  }
</div>
